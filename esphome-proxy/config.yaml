name: "ESPHome Proxy"
version: "2.0.0"
slug: "esphome-proxy"
description: "Expose an externally hosted ESPHome Device Builder through Home Assistant Ingress"
url: "https://github.com/Calimerorulez/hassio-addons/tree/main/esphome-proxy"
image: ghcr.io/calimerorulez/esphome-proxy

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:esphome"
panel_title: "ESPHome"
panel_admin: false

options:
  server: "esphome.local:6052"

schema:
  server: "match(^([A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?|(?:[0-9]{1,3}\\.){3}[0-9]{1,3}):([1-9][0-9]{0,4})$)"
