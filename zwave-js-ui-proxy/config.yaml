name: "Z-Wave JS UI Proxy"
version: "2.0.0"
slug: "zwave_js_ui_proxy"
description: "Proxy for an externally running Z-Wave JS UI instance"
url: "https://github.com/Calimerorulez/hassio-addons/tree/main/zwave-js-ui-proxy"
image: ghcr.io/calimerorulez/zwave-js-ui-proxy
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: stable
timeout: 30
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:z-wave"
panel_title: "Z-Wave JS UI"
panel_admin: false
watchdog: "tcp://[HOST]:[PORT:8099]"
options:
  server: "http://zwave-js-ui.local:8091"
schema:
  server: "url"
