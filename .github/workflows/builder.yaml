name: ESPHome Proxy Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - "esphome-proxy/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"

  push:
    branches:
      - main
    paths:
      - "esphome-proxy/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESPHome Proxy
    permissions:
      contents: read
      id-token: write
      packages: write

    uses: ./.github/workflows/build-app.yaml

    with:
      app: esphome-proxy
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    secrets: inherit
