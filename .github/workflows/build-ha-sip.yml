name: Build ha-sip

on:
  push:
    branches:
      - main
    paths:
      - "ha-sip/**"
      - ".github/workflows/build-ha-sip.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ha-sip-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/calimerorulez/ha-sip
  IMAGE_VERSION: "5.8"

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./ha-sip
          file: ./ha-sip/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base/amd64:stable
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
