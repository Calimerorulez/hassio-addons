name: Build ha-sip

on:
  push:
    branches:
      - main
    paths:
      - "ha-sip/**"
      - ".github/workflows/build-ha-sip.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ha-sip-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/calimerorulez/ha-sip
  IMAGE_VERSION: "5.7"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/hassio-addons/debian-base/amd64:stable
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/hassio-addons/debian-base/aarch64:stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./ha-sip
          file: ./ha-sip/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest manifests
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${IMAGE_VERSION}-amd64" \
            "${IMAGE_NAME}:${IMAGE_VERSION}-aarch64"
