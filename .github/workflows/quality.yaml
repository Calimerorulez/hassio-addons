name: Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - "esphome-proxy/**"
      - "nodered-proxy/**"
      - "openepaperlink-ap-proxy/**"
      - "zwave-js-ui-proxy/**"
      - "zigbee2mqtt-proxy/**"
      - ".hadolint.yaml"
      - ".yamllint"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "esphome-proxy/**"
      - "nodered-proxy/**"
      - "openepaperlink-ap-proxy/**"
      - "zwave-js-ui-proxy/**"
      - "zigbee2mqtt-proxy/**"
      - ".hadolint.yaml"
      - ".yamllint"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint active proxy add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck and yamllint
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint

      - name: Check shell scripts
        shell: bash
        run: |
          find             esphome-proxy             nodered-proxy             openepaperlink-ap-proxy             zwave-js-ui-proxy             zigbee2mqtt-proxy             -type f             \( -name "*.sh" -o -name "run.sh" \)             -print0 |
            xargs -0 --no-run-if-empty shellcheck --shell=bash

      - name: Check YAML
        shell: bash
        run: |
          yamllint             .github             .hadolint.yaml             esphome-proxy/config.yaml             esphome-proxy/translations             nodered-proxy/config.yaml             nodered-proxy/translations             openepaperlink-ap-proxy/config.yaml             zwave-js-ui-proxy/config.yaml             zwave-js-ui-proxy/translations             zigbee2mqtt-proxy/config.yaml             zigbee2mqtt-proxy/translations

      - name: Check GitHub Actions workflows
        shell: bash
        run: |
          docker run --rm             -v "${PWD}:/repo"             -w /repo             rhysd/actionlint:1.7.7

      - name: Check Dockerfiles
        shell: bash
        run: |
          for dockerfile in             esphome-proxy/Dockerfile             nodered-proxy/Dockerfile             openepaperlink-ap-proxy/Dockerfile             zwave-js-ui-proxy/Dockerfile             zigbee2mqtt-proxy/Dockerfile
          do
            docker run --rm               -i               -v "${PWD}:/repo"               -w /repo               ghcr.io/hadolint/hadolint:v2.13.1-debian               hadolint               --config /repo/.hadolint.yaml               "/repo/${dockerfile}"
          done
