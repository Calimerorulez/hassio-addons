name: ESPHome Proxy

on:
  pull_request:
    paths:
      - "esphome-proxy/**"
      - ".github/workflows/esphome-proxy.yml"
  push:
    branches:
      - main
    paths:
      - "esphome-proxy/**"
      - ".github/workflows/esphome-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: esphome-proxy/config.yaml .github/workflows/esphome-proxy.yml

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: esphome-proxy

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./esphome-proxy
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=2.0.0
            BUILD_ARCH=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'aarch64' }}
          tags: local/esphome-proxy:test
