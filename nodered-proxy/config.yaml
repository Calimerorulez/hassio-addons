name: "Node-RED Proxy"
version: "2.0.0"
slug: "nodered-proxy"
description: "Expose an externally hosted Node-RED instance through Home Assistant Ingress"
url: "https://github.com/Calimerorulez/hassio-addons/tree/main/nodered-proxy"

image: ghcr.io/calimerorulez/nodered-proxy

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false
stage: stable
timeout: 30

ingress: true
ingress_port: 8099
ingress_stream: true

panel_icon: "mdi:sitemap"
panel_title: "Node-RED"
panel_admin: false

watchdog: "tcp://[HOST]:[PORT:8099]"

options:
  server: "node-red.local:1880"

schema:
  server: "match(^([A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?|(?:[0-9]{1,3}\\.){3}[0-9]{1,3}):([1-9][0-9]{0,4})$)"
